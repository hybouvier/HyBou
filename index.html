<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HYBOU – Site en construction</title>
<style>
  :root { --bg:#0f1226; --fg:#f2f3fa; --muted:#a9adc9; --accent:#8b7cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 30% 20%, #232857 0%, var(--bg) 60%);
    color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align:center; padding:24px;
  }
  main { max-width:560px; }
  .logo { font-size:clamp(3rem, 12vw, 5.5rem); font-weight:800; letter-spacing:.12em; }
  .bar { width:64px; height:4px; background:var(--accent); border-radius:2px; margin:20px auto 28px; }
  h1 { font-size:clamp(1.4rem, 5vw, 2rem); font-weight:600; margin-bottom:14px; }
  p { color:var(--muted); line-height:1.6; font-size:1.05rem; }
</style>
</head>
<body>
<main>
  <div class="logo">HYBOU</div>
  <div class="bar"></div>
  <h1>Site en construction</h1>
  <p>Notre nouveau site arrive bientôt.<br>Merci de votre patience et à très vite !</p>
</main>
</body>
</html>
